<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booki</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <img src="images/logo/Booki.png" alt="logo Booki">
        <nav>
            <ul>
                <li><a href="#hébergements">Hébergements</a></li>
                <li><a href="#activités">Activités</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Trouvez votre hébergement...</h1>
            <p>...</p>
            <form action="#">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" name="ville" placeholder="Marseille, France">
                <button type="submit">Rechercher</button>
            </form>
            <div>
                <h3>
                    Filtres
                </h3>
                <button type="button" class="filtres" ><i class="fa-solid fa-money-bill-wave"></i>Économique</button>
                <button type="button" class="filtres" ><i class="fa-solid fa-person"></i>Familial</button>
                <button type="button" class="filtres" ><i class="fa-solid fa-heart"></i>Romantique</button>
                <button type="button" class="filtres" ><i class="fa-solid fa-star"></i>Nos pépites</button>
                <div class="infobar">
                    <i class="fa-solid fa-info"></i>
                    <p>Plus de 500 logements sont disponibles dans cette ville</p>

                </div>
            </div>
        </section>
    </main>

</body>
</html>
